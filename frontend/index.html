<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>守護無聲世界 - SignBridge AI</title>
    <!-- 載入 Tailwind CSS 快速切版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-slate-900 text-white font-sans h-screen flex flex-col relative overflow-hidden"
  >
    <!-- 頂部導覽列 -->
    <header
      class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center z-10"
    >
      <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
        🤟 守護無聲世界 (SignBridge AI)
      </h1>
      <div class="flex items-center gap-4">
        <select
          id="scenario_select"
          class="bg-slate-700 text-sm px-3 py-1.5 rounded-lg border border-slate-600"
        >
          <option value="medical">🏥 醫院診間模式</option>
          <option value="bank">🏛️ 政府臨櫃模式</option>
          <option value="restaurant">🍔 餐廳點餐模式</option>
        </select>
        <span class="text-xs text-emerald-400">● 系統運作中</span>

        <!-- 登入狀態顯示 / 登入按鈕 -->
        <div id="user_profile_area">
          <button
            onclick="toggleLoginModal(true)"
            class="bg-emerald-500 hover:bg-emerald-600 px-4 py-1.5 rounded-lg text-sm font-semibold transition"
          >
            🔐 會員登入 / 註冊
          </button>
        </div>
      </div>
    </header>

    <!-- 主畫面雙欄區域 (65% : 35%) -->
    <main class="flex-1 flex overflow-hidden">
      <!-- 左區 (65%)：手語鏡頭 + 加大版 2D 虛擬人浮動視窗 -->
      <section
        class="w-[65%] p-4 flex flex-col gap-4 border-r border-slate-700 relative"
      >
        <div
          class="relative flex-1 bg-black rounded-2xl overflow-hidden border-2 border-slate-700 flex items-center justify-center"
        >
          <!-- 1. WebCam 視訊串流 (預設照鏡子鏡像模式) -->
          <video
            id="webcam"
            class="mirror-mode absolute inset-0 w-full h-full object-cover"
            autoplay
            playsinline
          ></video>
          <!-- 2. Canvas 骨骼繪製層 -->
          <canvas
            id="output_canvas"
            class="mirror-mode absolute inset-0 w-full h-full object-cover z-10"
          ></canvas>
          <div class="absolute top-4 left-4 z-30 flex gap-2">
            <button
              id="start_camera_btn"
              type="button"
              class="bg-slate-800/90 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition"
            >
              開啟攝影機
            </button>
            <button
              id="stop_camera_btn"
              type="button"
              class="hidden bg-slate-800/90 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition"
            >
              關閉攝影機
            </button>
          </div>

          <!-- 3. 🤟 加大版 2D 虛擬手語人 (PIP 畫中畫浮動視窗) -->
          <div
            id="avatar_box"
            class="absolute top-4 right-4 z-30 w-72 h-[380px] bg-slate-800/90 backdrop-blur-md rounded-2xl border-2 border-emerald-500 shadow-2xl flex flex-col justify-between p-4 transition-all duration-300"
          >
            <div
              class="flex justify-between w-full items-center text-xs text-emerald-400 font-bold border-b border-slate-700 pb-2"
            >
              <span class="flex items-center gap-1">🤟 2D 虛擬手語翻譯人</span>
              <span
                class="text-[10px] bg-emerald-500/20 px-2 py-0.5 rounded text-emerald-300 border border-emerald-500/30"
                >Live 2D</span
              >
            </div>

            <!-- 2D 虛擬人物 SVG 繪圖 -->
            <div
              class="flex-1 flex flex-col items-center justify-center relative my-2 overflow-hidden bg-slate-900/60 rounded-xl border border-slate-700/50"
            >
              <svg
                id="avatar_svg"
                class="w-48 h-56"
                viewBox="0 0 200 240"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- 人物光暈背景 -->
                <circle
                  cx="100"
                  cy="100"
                  r="70"
                  fill="#10B981"
                  fill-opacity="0.15"
                  class="animate-pulse"
                />

                <!-- 身體 / 衣著 -->
                <path
                  d="M50 210 C50 165, 70 150, 100 150 C130 150, 150 165, 150 210 Z"
                  fill="#047857"
                />
                <path d="M85 150 L100 185 L115 150 Z" fill="#10B981" />

                <!-- 脖子 -->
                <rect
                  x="92"
                  y="132"
                  width="16"
                  height="20"
                  rx="4"
                  fill="#F3D0B7"
                />

                <!-- 左手臂 & 手掌 -->
                <g id="left_arm">
                  <path
                    d="M55 160 C35 180, 40 200, 30 205"
                    stroke="#047857"
                    stroke-width="14"
                    stroke-linecap="round"
                  />
                  <circle cx="26" cy="207" r="9" fill="#F3D0B7" />
                </g>

                <!-- 右手臂 & 手掌 -->
                <g id="right_arm">
                  <path
                    d="M145 160 C165 180, 160 200, 170 205"
                    stroke="#047857"
                    stroke-width="14"
                    stroke-linecap="round"
                  />
                  <circle cx="174" cy="207" r="9" fill="#F3D0B7" />
                </g>

                <!-- 頭部與臉部 -->
                <circle cx="100" cy="95" r="40" fill="#F3D0B7" />

                <!-- 頭髮 -->
                <path
                  d="M60 92 C60 55, 140 55, 140 92 C140 68, 60 68, 60 92 Z"
                  fill="#1F2937"
                />

                <!-- 眼睛 -->
                <circle cx="87" cy="92" r="4" fill="#111827" />
                <circle cx="113" cy="92" r="4" fill="#111827" />
                <circle cx="88" cy="90" r="1.5" fill="white" />
                <circle cx="114" cy="90" r="1.5" fill="white" />

                <!-- 微笑嘴巴 -->
                <path
                  d="M92 112 Q100 120 108 112"
                  stroke="#D97706"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  fill="none"
                />

                <!-- 耳朵 -->
                <circle cx="59" cy="95" r="6" fill="#E5B596" />
                <circle cx="141" cy="95" r="6" fill="#E5B596" />
              </svg>
            </div>

            <!-- 狀態說明欄位與按鈕 -->
            <div class="flex flex-col gap-2">
              <p
                id="avatar_status"
                class="text-xs text-center text-slate-300 font-medium bg-slate-900/80 py-1.5 rounded-lg border border-slate-700/60"
              >
                準備翻譯中...
              </p>
              <button
                onclick="simulateAvatarSign('【你好，請問有什麼需要幫忙嗎？】')"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded-xl font-medium transition shadow-lg flex items-center justify-center gap-1"
              >
                <span>▶</span> 測試虛擬人手語動作
              </button>
            </div>
          </div>

          <!-- 4. 即時辨識字幕區 -->
          <div
            class="absolute bottom-4 left-4 right-4 z-20 bg-slate-900/80 backdrop-blur-md p-3.5 rounded-xl border border-emerald-500/50 flex items-center justify-between gap-3"
          >
            <div class="min-w-0">
              <div class="text-xs text-emerald-400 font-semibold mb-0.5">
                AI 即時手語辨識結果：
              </div>
              <div id="result_text" class="text-base font-bold text-white">
                請允許開啟攝影機...
              </div>
            </div>
            <button
              id="recognize_btn"
              type="button"
              class="shrink-0 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-3 py-2 rounded-lg text-xs font-semibold transition"
            >
              錄影 3 秒並辨識
            </button>
          </div>
        </div>

        <!-- 快捷標籤列 -->
        <div class="flex gap-2">
          <button
            onclick="sendQuickText('我肚子痛')"
            class="bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-full text-xs border border-slate-700 text-slate-300 hover:text-white transition"
          >
            + 我肚子痛
          </button>
          <button
            onclick="sendQuickText('領藥處在哪裡？')"
            class="bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-full text-xs border border-slate-700 text-slate-300 hover:text-white transition"
          >
            + 領藥處在哪
          </button>
          <button
            onclick="sendQuickText('我要辦理掛號預約')"
            class="bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-full text-xs border border-slate-700 text-slate-300 hover:text-white transition"
          >
            + 掛號預約
          </button>
        </div>
      </section>

      <!-- 右區 (35%)：對話歷程與語音輸入區 -->
      <section class="w-[35%] p-4 flex flex-col gap-4 bg-slate-900/50">
        <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-xs font-semibold text-slate-300">目前服務 Session</p>
              <p id="active_session_status" class="text-xs text-slate-400 mt-1">
                請先登入以開始服務
              </p>
              <p
                id="active_session_id"
                class="text-[10px] text-slate-500 mt-1 truncate"
              ></p>
            </div>
            <div class="flex shrink-0 flex-col gap-1">
              <button
                id="start_session_btn"
                type="button"
                class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-3 py-2 rounded-lg text-xs font-semibold transition"
              >
                開始服務
              </button>
              <button
                id="end_session_btn"
                type="button"
                class="hidden bg-red-700 hover:bg-red-600 disabled:opacity-50 px-3 py-2 rounded-lg text-xs font-semibold transition"
              >
                結束服務
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between mt-3 mb-1">
            <p class="text-[10px] text-slate-400">我的 Session</p>
            <button
              id="refresh_sessions_btn"
              type="button"
              class="text-[10px] text-emerald-400 hover:text-emerald-300"
            >
              重新整理
            </button>
          </div>
          <p id="session_error" class="hidden text-xs text-red-400 mb-2"></p>
          <ul
            id="session_list"
            class="max-h-24 overflow-y-auto flex flex-col gap-1 text-[10px] text-slate-400"
          >
            <li>登入後載入 Session 清單。</li>
          </ul>
        </div>

        <!-- 對話歷程區 -->
        <div
          id="chat_box"
          class="flex-1 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/80 overflow-y-auto flex flex-col gap-3"
        >
          <div
            class="self-start bg-slate-700/80 p-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm shadow"
          >
            <span class="block text-[10px] text-slate-400 mb-1"
              >聽障使用者 (手語輸入)</span
            >
            請問診間在哪裡？
          </div>
          <div
            class="self-end bg-emerald-600 p-3 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow"
          >
            <span class="block text-[10px] text-emerald-200 mb-1"
              >醫護人員 (語音輸入)</span
            >
            請直走到底右轉，搭電梯上二樓 201 診間。
          </div>
        </div>

        <!-- 聽人語音/文字操控區 -->
        <div
          class="bg-slate-800 p-3 rounded-2xl border border-slate-700 flex flex-col gap-2"
        >
          <div class="flex gap-2">
            <input
              type="text"
              id="voice_input"
              placeholder="按住右側按鈕說話，或在此輸入..."
              class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 text-sm focus:outline-none focus:border-emerald-500"
              onkeypress="handleKeyPress(event)"
            />
            <button
              onclick="sendTextMessage()"
              class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-xl font-semibold text-xs border border-slate-600"
            >
              發送
            </button>
          </div>

          <!-- 按住說話（Web Speech API 語音辨識）按鈕 -->
          <button
            id="talk_btn"
            class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-red-500 py-3 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 select-none touch-none"
          >
            <span id="talk_icon">🎙️</span>
            <span id="talk_text">按住不放開始說話</span>
          </button>
        </div>
      </section>
    </main>

    <!-- 🔐 會員登入 / 註冊 彈窗 (Modal) -->
    <div
      id="login_modal"
      class="hidden absolute inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl shadow-2xl relative"
      >
        <button
          onclick="toggleLoginModal(false)"
          class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg"
        >
          ✕
        </button>

        <!-- 頁籤選擇 -->
        <div class="flex border-b border-slate-700 mb-6">
          <button
            id="tab_login"
            onclick="switchAuthTab('login')"
            class="flex-1 pb-3 text-center border-b-2 border-emerald-500 text-emerald-400 font-bold text-sm"
          >
            帳號登入
          </button>
          <button
            id="tab_register"
            onclick="switchAuthTab('register')"
            class="flex-1 pb-3 text-center text-slate-400 font-bold text-sm"
          >
            建立新帳號
          </button>
        </div>

        <!-- 登入表單 -->
        <form
          id="login_form"
          class="flex flex-col gap-4"
          onsubmit="handleLogin(event)"
        >
          <div>
            <label class="block text-xs text-slate-400 mb-1"
              >帳號 (Email)</label
            >
            <input
              type="email"
              id="login_email"
              required
              value="test@example.com"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">密碼</label>
            <input
              type="password"
              id="login_password"
              required
              value="123456"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div
            id="login_error"
            class="hidden text-xs text-red-400 text-center"
          ></div>
          <button
            type="submit"
            id="login_btn"
            class="bg-emerald-500 hover:bg-emerald-600 py-3 rounded-xl font-semibold text-sm mt-2 transition"
          >
            立即登入
          </button>
        </form>

        <!-- 註冊表單 -->
        <form
          id="register_form"
          class="hidden flex flex-col gap-4"
          onsubmit="handleRegister(event)"
        >
          <div>
            <label class="block text-xs text-slate-400 mb-1"
              >顯示姓名 / 暱稱</label
            >
            <input
              type="text"
              id="reg_name"
              required
              placeholder="例如：蕭小明"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1"
              >電子信箱 (Email)</label
            >
            <input
              type="email"
              id="reg_email"
              required
              placeholder="example@mail.com"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">設定密碼</label>
            <input
              type="password"
              id="reg_password"
              required
              placeholder="••••••••"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500"
            />
          </div>
          <div id="register_msg" class="hidden text-xs text-center"></div>
          <button
            type="submit"
            id="register_btn"
            class="bg-emerald-500 hover:bg-emerald-600 py-3 rounded-xl font-semibold text-sm mt-2 transition"
          >
            註冊並發送至 .NET 後端
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
